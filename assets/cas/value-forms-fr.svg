<text x="817.3" y="500.0" font-family="Google Sans Text, Google Sans, system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c82a3" text-anchor="start">on sait ce qui est parti, quand,</text>
<text x="817.3" y="515.0" font-family="Google Sans Text, Google Sans, system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7c82a3" text-anchor="start">et si c'est passé</text>
<text x="40.0" y="560.0" font-family="Google Sans Text, Google Sans, system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#e8eaf6" text-anchor="start">Pas besoin d'API. Si un humain peut remplir le formulaire, la machine aussi. Et elle garde une trace de chaque envoi.</text>
