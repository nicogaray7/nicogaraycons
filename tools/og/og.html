<!doctype html>
<!-- Share image template. Render at 1200x630: chrome --headless=new --window-size=1200,630 --screenshot=out.png "og.html?lang=fr|en" -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Code:wght@500&display=block" rel="stylesheet">
<style>
  :root { --bg:#07080f; --accent:#5b6ef5; --green:#34d399; --muted:#7c82a3; --text:#e8eaf6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  .card { position:relative; width:1200px; height:630px; font-family:"Google Sans", sans-serif; color:var(--text); overflow:hidden; }
  .grid { position:absolute; inset:0;
    background-image: linear-gradient(rgba(124,130,163,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(124,130,163,.09) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 70% 90% at 78% 50%, #000 30%, transparent 75%); }
  .glow1 { position:absolute; width:720px; height:720px; right:-160px; top:-140px; border-radius:50%;
    background: radial-gradient(circle, rgba(91,110,245,.55) 0%, rgba(91,110,245,.12) 45%, transparent 70%); filter: blur(10px); }
  .glow2 { position:absolute; width:420px; height:420px; right:120px; bottom:-230px; border-radius:50%;
    background: radial-gradient(circle, rgba(52,211,153,.22) 0%, transparent 70%); }
  .text { position:absolute; left:72px; top:0; bottom:0; width:600px; display:flex; flex-direction:column; justify-content:center; }
  .pill { align-self:flex-start; display:flex; align-items:center; gap:10px; padding:9px 18px; border-radius:999px;
    border:1px solid rgba(91,110,245,.5); background:rgba(91,110,245,.12); font-size:20px; font-weight:500; color:#c7cdfb; letter-spacing:.04em; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 12px var(--green); }
  h1 { margin-top:26px; font-size:86px; font-weight:700; letter-spacing:-.03em; line-height:1; color:#fff; }
  .sub { margin-top:24px; font-size:36px; line-height:1.25; font-weight:500; color:var(--text); }
  .sub em { font-style:normal; background:linear-gradient(90deg,#8c9bff,var(--accent)); -webkit-background-clip:text; color:transparent; }
  .foot { position:absolute; left:72px; right:72px; bottom:46px; display:flex; justify-content:space-between; align-items:center; font-size:24px; }
  .foot b { font-weight:700; color:#fff; }
  .foot span { color:var(--muted); font-family:"Google Sans Code", monospace; font-size:20px; }
  svg { position:absolute; right:40px; top:60px; }
</style>
</head>
<body>
<div class="card">
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>

  <!-- Agent graph: one central agent orchestrating tools -->
  <svg width="500" height="470" viewBox="0 0 500 470">
    <defs>
      <radialGradient id="core" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="#8c9bff"/><stop offset="1" stop-color="#5b6ef5"/>
      </radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <g stroke="#5b6ef5" stroke-width="2" stroke-opacity=".6" fill="none">
      <path d="M250 235 L110 90"/><path d="M250 235 L400 80"/><path d="M250 235 L450 250"/>
      <path d="M250 235 L390 400"/><path d="M250 235 L100 380"/><path d="M250 235 L60 230"/>
    </g>
    <g stroke="#7c82a3" stroke-width="1.5" stroke-opacity=".35" stroke-dasharray="4 6" fill="none">
      <path d="M110 90 L400 80"/><path d="M450 250 L390 400"/><path d="M100 380 L60 230"/>
    </g>
    <!-- data pulses on the edges -->
    <g fill="#34d399"><circle cx="180" cy="162" r="5"/><circle cx="350" cy="243" r="5"/><circle cx="175" cy="307" r="5"/></g>
    <!-- tool nodes -->
    <g fill="#10121f" stroke="#5b6ef5" stroke-width="2">
      <rect x="80" y="60" width="60" height="60" rx="16"/><rect x="370" y="50" width="60" height="60" rx="16"/>
      <rect x="420" y="220" width="60" height="60" rx="16"/><rect x="360" y="370" width="60" height="60" rx="16"/>
      <rect x="70" y="350" width="60" height="60" rx="16"/><rect x="30" y="200" width="60" height="60" rx="16"/>
    </g>
    <!-- simple glyphs inside tool nodes: mail, doc, calendar, chart, chat, db -->
    <g stroke="#c7cdfb" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="96" y="79" width="28" height="22" rx="3"/><path d="M96 82 L110 93 L124 82"/>
      <path d="M390 66 h14 l8 8 v22 h-22 z"/><path d="M395 84 h12 M395 90 h9"/>
      <rect x="436" y="238" width="28" height="26" rx="3"/><path d="M436 246 h28 M443 234 v8 M457 234 v8"/>
      <path d="M377 416 v-10 M387 416 v-18 M397 416 v-14 M407 416 v-24"/>
      <path d="M84 368 h32 v18 h-18 l-8 7 v-7 h-6 z"/>
      <ellipse cx="60" cy="219" rx="14" ry="5"/><path d="M46 219 v22 c0 3 6 5 14 5 s14-2 14-5 v-22 M46 230 c0 3 6 5 14 5 s14-2 14-5"/>
    </g>
    <!-- central agent -->
    <circle cx="250" cy="235" r="78" fill="#5b6ef5" opacity=".45" filter="url(#blur)"/>
    <circle cx="250" cy="235" r="62" fill="url(#core)" stroke="#c7cdfb" stroke-opacity=".6" stroke-width="2"/>
    <g fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 205 l7 21 21 7 -21 7 -7 21 -7 -21 -21 -7 21 -7 z"/>
      <path d="M277 205 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z"/>
    </g>
  </svg>

  <div class="text">
    <div class="pill"><span class="dot"></span><span id="kicker"></span></div>
    <h1>Nico Garay</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="foot"><b>nicogaray.com</b><span id="remote">100% remote</span></div>
</div>
<script>
  const T = {
    fr: { kicker: "CONSULTANT IA", sub: "J'intègre des <em>agents IA</em><br>qui automatisent ce qui<br>vous fait perdre du temps" },
    en: { kicker: "AI CONSULTANT", sub: "I integrate <em>AI agents</em><br>that automate what<br>wastes your time" },
  };
  const t = T[new URLSearchParams(location.search).get("lang") || "fr"];
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("sub").innerHTML = t.sub;
</script>
</body>
</html>
