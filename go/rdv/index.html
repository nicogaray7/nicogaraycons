<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Consent Mode v2 par défaut (mis à jour ensuite par Axeptio) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'ad_storage':'denied','ad_user_data':'denied','ad_personalization':'denied',
      'analytics_storage':'granted','functionality_storage':'granted','security_storage':'granted'
    });
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L2DZPV8S00"></script>
  <script>
    gtag('js', new Date());
    if (/(^|\.)nicogaray\.com$/.test(location.hostname)) { gtag('config', 'G-L2DZPV8S00'); }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Réserver un appel découverte</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:'Google Sans Text','Google Sans',system-ui,sans-serif;background:#07080f;color:#e8eaf6;margin:0;padding:24px 12px 40px}
    header{max-width:960px;margin:0 auto 12px;text-align:center}
    h1{font-size:1.5rem;line-height:1.25;margin:8px 0}
    p{color:#a3a8c3;line-height:1.5;margin:0 0 8px}
    a{color:#818cf8}
    #cal-inline{max-width:1000px;margin:0 auto;min-height:620px;width:100%}
    .fallback{text-align:center;margin-top:16px;font-size:.95rem}
  </style>
  <script>
    (function(){
      var p = new URLSearchParams(window.location.search);
      function clean(v){ return (v||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,60); }
      var lead = clean(p.get('lead') || p.get('utm_content'));
      var email = clean(p.get('email') || p.get('utm_term'));
      // Attribution transmise à Cal.com (enregistrée sur la réservation)
      var utm = {
        utm_source: p.get('utm_source') || 'email',
        utm_medium: p.get('utm_medium') || 'site',
        utm_campaign: p.get('utm_campaign') || 'prospection-bordeaux'
      };
      if (lead) utm.utm_content = lead;
      if (email) utm.utm_term = email;
      window.__utm = utm; window.__lead = lead; window.__email = email;
      window.__fallback = 'https://cal.com/flegm/30min?' + new URLSearchParams(utm).toString();
      // Applique le choix mémorisé (opt-out) : granted par défaut, denied si l'utilisateur a refusé
      try { var _r = localStorage.getItem('ng-pref-v1'); if (_r) { gtag('consent','update',{ 'analytics_storage': JSON.parse(_r).analytics ? 'granted' : 'denied' }); } } catch(e){}
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'clic_rdv_dl', lead: lead || '(non renseigne)', email_sequence: email || '(non renseigne)' });
      gtag('event', 'clic_rdv', { lead: lead || '(non renseigne)', email_sequence: email || '(non renseigne)' });
    })();
  </script>
</head>
<body>
  <header>
    <h1>Réserver un appel découverte</h1>
    <p>30 minutes en visio, gratuit et sans engagement. Choisissez le créneau qui vous arrange.</p>
  </header>
  <div id="cal-inline"></div>
  <p class="fallback">Le calendrier ne s'affiche pas ? <a id="manual" href="https://cal.com/flegm/30min" target="_blank" rel="noopener">Ouvrir la page de réservation</a> · <a href="/">Retour au site</a></p>
  <script>
    (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
    (function(){
      try { var a = document.getElementById('manual'); if (window.__fallback && a) a.href = window.__fallback; } catch(e){}
      Cal("init", "30min", { origin: "https://app.cal.com" });
      var cfg = Object.assign({ layout: "month_view", theme: "dark" }, window.__utm || {});
      Cal.ns["30min"]("inline", { elementOrSelector: "#cal-inline", calLink: "flegm/30min", config: cfg });
      Cal.ns["30min"]("ui", { theme: "dark", hideEventTypeDetails: false, layout: "month_view", cssVarsPerTheme: { light: { "cal-brand": "#818cf8" }, dark: { "cal-brand": "#818cf8" } } });
      // Conversion GA4 : réservation réellement confirmée dans Cal.com.
      // Seuls le type de rendez-vous et l'attribution partent vers GA4, jamais le nom ni l'e-mail saisis.
      var sent = false;
      function booked(){
        if (sent) return; sent = true;
        gtag('event', 'rdv_reserve', { rdv_type: '30min', lead: window.__lead || '(non renseigne)', email_sequence: window.__email || '(non renseigne)' });
        window.dataLayer.push({ event: 'rdv_reserve_dl', rdv_type: '30min' });
      }
      Cal.ns["30min"]("on", { action: "bookingSuccessfulV2", callback: booked });
      Cal.ns["30min"]("on", { action: "bookingSuccessful", callback: booked });
    })();
  </script>
</body>
</html>
