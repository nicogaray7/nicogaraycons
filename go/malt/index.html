<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Buffer page: ne pas indexer -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Redirection vers Malt…</title>

  <!-- Cible de redirection (modifiable a un seul endroit) -->
  <script>
    window.MALT_URL = "https://www.malt.fr/profile/nicogaray";
    window.REDIRECT_FALLBACK_MS = 1500; // safety net if the GA4 hit is never acknowledged
  </script>

  <!-- Google Consent Mode v2 (opt-out: analytics granted by default, denied if the visitor refused on the site) -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'ad_storage': 'denied', 'ad_user_data': 'denied', 'ad_personalization': 'denied',
      'analytics_storage': 'granted', 'functionality_storage': 'granted',
      'personalization_storage': 'denied', 'security_storage': 'granted'
    });
    try { var _r = localStorage.getItem('ng-pref-v1'); if (_r) { gtag('consent', 'update', { 'analytics_storage': JSON.parse(_r).analytics ? 'granted' : 'denied' }); } } catch (e) {}
  </script>

  <!-- Google tag (gtag.js): this page used to rely on an empty GTM container, so no visit was ever recorded -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L2DZPV8S00"></script>
  <script>
    gtag('js', new Date());
    if (/(^|\.)nicogaray\.com$/.test(location.hostname)) { gtag('config', 'G-L2DZPV8S00'); }

    window.doRedirect = function () {
      if (window.__redirected) return;
      window.__redirected = true;
      window.location.replace(window.MALT_URL);
    };

    // Redirect event sent straight to GA4. The page_view above already carries the utm_* of this URL;
    // the event adds the partner and the ?lead= slot, then redirects as soon as the hit is sent.
    var _p = new URLSearchParams(window.location.search);
    gtag('event', 'malt_redirect', {
      partenaire: 'malt',
      lead: (_p.get('lead') || _p.get('utm_content') || '(direct)').slice(0, 60),
      link_destination: window.MALT_URL,
      event_callback: window.doRedirect,
      event_timeout: window.REDIRECT_FALLBACK_MS
    });

    // Safety net: redirect even if gtag.js is blocked (ad blocker) or slow
    setTimeout(window.doRedirect, window.REDIRECT_FALLBACK_MS);
  </script>

  <!-- Fallback sans JS : redirige apres 2s -->
  <noscript>
    <meta http-equiv="refresh" content="2;url=https://www.malt.fr/profile/nicogaray" />
  </noscript>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      background:#07080f;color:#e8eaf6;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;
    }
    .wrap{text-align:center;padding:32px}
    .spinner{
      width:42px;height:42px;margin:0 auto 24px;
      border:3px solid rgba(91,110,245,0.2);border-top-color:#5b6ef5;
      border-radius:50%;animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.1rem;font-weight:600;margin-bottom:8px}
    p{font-size:.9rem;color:#7c82a3}
    a{color:#818cf8}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h1>Redirection vers Malt…</h1>
    <p>Si rien ne se passe, <a href="https://www.malt.fr/profile/nicogaray">cliquez ici</a>.</p>
  </div>
</body>
</html>
