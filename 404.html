<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page introuvable | Nico Garay</title>
  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #07080f; --bg3: #12152a; --accent: #5b6ef5; --text: #e8eaf6; --muted: #7c82a3; --border: rgba(255,255,255,0.07); }
    body { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: var(--bg); color: var(--text); font-family: 'Google Sans', system-ui, sans-serif; line-height: 1.6; text-align: center; }
    .code { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 14px; }
    p { color: var(--muted); max-width: 440px; margin: 0 auto 32px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 10px; font-weight: 500; text-decoration: none; }
    .primary { background: var(--accent); color: #fff; }
    .ghost { background: var(--bg3); border: 1px solid var(--border); color: var(--text); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">Erreur 404</div>
    <h1>Cette page n'existe pas ou a changé d'adresse</h1>
    <p>Le lien est peut-être ancien. Vous trouverez tout le contenu depuis l'accueil ou la liste des réalisations.</p>
    <div class="links">
      <a class="primary" href="/">Retour à l'accueil</a>
      <a class="ghost" href="/cas/">Voir les réalisations</a>
    </div>
  </main>
</body>
</html>
